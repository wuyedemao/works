<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行车 · 齐天号</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(1200px 700px at 50% 0%, #1a2440 0%, #0a0e1a 60%, #05070d 100%);
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; color:#cfe0f5;
  }
  h1 { font-size:15px; font-weight:600; letter-spacing:3px; color:#8fb4de; margin-bottom:14px; opacity:.85; }
  .stage {
    width:100%; max-width:1200px; border-radius:18px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(140,180,230,.18);
    background:#0d3b6e;
  }
  svg { display:block; width:100%; height:auto; }

  /* ---------- 动画 ---------- */
  @keyframes bob {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    30%     { transform: translate(0,-9px) rotate(-.55deg); }
    65%     { transform: translate(0,5px) rotate(.35deg); }
  }
  .bob { animation: bob 5.2s ease-in-out infinite; transform-box: view-box; transform-origin: 600px 380px; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1560px); } }
  .cloud { transform-box: view-box; }
  .c1 { animation: drift 26s linear infinite; }
  .c2 { animation: drift 18s linear infinite; animation-delay:-9s; }
  .c3 { animation: drift 34s linear infinite; animation-delay:-20s; }
  .c4 { animation: drift 15s linear infinite; animation-delay:-4s; }

  @keyframes wind { from { transform: translateX(0); opacity:0; } 12%{opacity:.85;} 80%{opacity:.7;} to { transform: translateX(-1500px); opacity:0; } }
  .w1 { animation: wind 1.5s linear infinite; }
  .w2 { animation: wind 1.1s linear infinite; animation-delay:-.5s; }
  .w3 { animation: wind 1.9s linear infinite; animation-delay:-1.2s; }
  .w4 { animation: wind 1.35s linear infinite; animation-delay:-.8s; }

  @keyframes breathe { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.035,1.02); } }
  .breathe { animation: breathe 3.4s ease-in-out infinite; transform-box: view-box; transform-origin: 505px 290px; }

  @keyframes bobHead { 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(3px) rotate(1.5deg);} }
  .bearHead { animation: bobHead 3.4s ease-in-out infinite; transform-box: view-box; transform-origin: 566px 232px; }

  @keyframes rideBob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }
  .ride { animation: rideBob 0.9s ease-in-out infinite; transform-box: view-box; transform-origin: 500px 380px; }

  @keyframes spark { 0%,100%{ opacity:0; transform: scale(.4) rotate(0deg);} 30%{ opacity:1; transform: scale(1.15) rotate(40deg);} 60%{ opacity:.35; transform: scale(.8) rotate(80deg);} }
  .spark { animation: spark .55s steps(6) infinite; transform-box: view-box; transform-origin: 508px 243px; }
  .spark2 { animation: spark .55s steps(6) infinite; animation-delay:-.22s; transform-box: view-box; transform-origin: 500px 236px; }
  .spark3 { animation: spark .55s steps(6) infinite; animation-delay:-.38s; transform-box: view-box; transform-origin: 518px 238px; }

  @keyframes creak { 0%,100%{ opacity:.0; } 45%{ opacity:.9; } }
  .creak { animation: creak .55s ease-in-out infinite; }
  .creak2 { animation: creak .55s ease-in-out infinite; animation-delay:-.27s; }

  @keyframes floatScrew { 0%,100%{ transform: translate(0,0) rotate(0deg);} 50%{ transform: translate(-14px,-10px) rotate(180deg);} }
  .screwFloat { animation: floatScrew 4s ease-in-out infinite; transform-box: view-box; }
</style>
</head>
<body>

<h1>鹈 鹕 骑 行 · 齐 天 号 重 型 客 机</h1>

<div class="stage">
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车在孙悟空驾驶的大型飞机机翼上骑行，翅膀托着北极熊，秦始皇骑在熊背上打螺丝">

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#0b2f5e"/>
    <stop offset=".32"  stop-color="#1f6fae"/>
    <stop offset=".62"  stop-color="#69b9e8"/>
    <stop offset=".86"  stop-color="#b7e2f8"/>
    <stop offset="1"    stop-color="#e6f6ff"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0"   stop-color="#fff8d8" stop-opacity=".95"/>
    <stop offset=".35" stop-color="#ffe27a" stop-opacity=".55"/>
    <stop offset="1"   stop-color="#ffd24a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#fbfeff"/>
    <stop offset=".34" stop-color="#dde8f2"/>
    <stop offset=".58" stop-color="#a9bccf"/>
    <stop offset=".82" stop-color="#7b91a8"/>
    <stop offset="1"   stop-color="#5a7186"/>
  </linearGradient>
  <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#c9d8e6"/>
    <stop offset=".5"  stop-color="#8ea3b8"/>
    <stop offset="1"   stop-color="#5d7085"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff"/>
    <stop offset=".22" stop-color="#e6eef6"/>
    <stop offset=".62" stop-color="#b3c6d8"/>
    <stop offset="1"   stop-color="#7f96ac"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#fff5c2"/>
    <stop offset=".45" stop-color="#f2b73a"/>
    <stop offset="1"   stop-color="#a86d0d"/>
  </linearGradient>
  <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0"   stop-color="#ffe9a8"/>
    <stop offset="1"   stop-color="#d99a1c"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#e8fbff" stop-opacity=".85"/>
    <stop offset=".5"  stop-color="#8fd4f2" stop-opacity=".55"/>
    <stop offset="1"   stop-color="#2f7ea8" stop-opacity=".65"/>
  </linearGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff" stop-opacity=".98"/>
    <stop offset="1"   stop-color="#cfe4f6" stop-opacity=".85"/>
  </linearGradient>
  <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#eef3f8"/>
    <stop offset="1"   stop-color="#c3d1de"/>
  </linearGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff"/>
    <stop offset=".5"  stop-color="#eaf1f8"/>
    <stop offset="1"   stop-color="#b7c9da"/>
  </linearGradient>
  <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#ffd35e"/>
    <stop offset=".55" stop-color="#f9a52c"/>
    <stop offset="1"   stop-color="#e2761a"/>
  </linearGradient>
  <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffbe52"/>
    <stop offset="1"   stop-color="#e0751c"/>
  </linearGradient>
  <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#3a4050"/>
    <stop offset=".5"  stop-color="#232833"/>
    <stop offset="1"   stop-color="#10131a"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffe0c2"/>
    <stop offset="1"   stop-color="#e9b489"/>
  </linearGradient>
  <linearGradient id="monkeyFur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#d99a4e"/>
    <stop offset="1"   stop-color="#a86a25"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0"   stop-color="#ffffff"/>
    <stop offset=".4"  stop-color="#c4ced8"/>
    <stop offset="1"   stop-color="#76838f"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ff6a5a"/>
    <stop offset="1"   stop-color="#c02a20"/>
  </linearGradient>

  <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#06203c" flood-opacity=".38"/>
  </filter>
  <filter id="tiny" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#0b2540" flood-opacity=".45"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- 云朵形状 -->
  <g id="cloudShape">
    <ellipse cx="-46" cy="10"  rx="44" ry="25" fill="url(#cloud)"/>
    <ellipse cx="44"  cy="12"  rx="47" ry="27" fill="url(#cloud)"/>
    <ellipse cx="-18" cy="-16" rx="41" ry="27" fill="url(#cloud)"/>
    <ellipse cx="26"  cy="-13" rx="35" ry="23" fill="url(#cloud)"/>
    <ellipse cx="0"   cy="0"   rx="60" ry="31" fill="url(#cloud)"/>
    <rect x="-90" y="12" width="180" height="26" rx="13" fill="url(#cloud)"/>
    <ellipse cx="-30" cy="-4" rx="30" ry="16" fill="#ffffff" opacity=".55"/>
  </g>
</defs>

<!-- ================= 天空 ================= -->
<rect width="1200" height="700" fill="url(#sky)"/>
<circle cx="1046" cy="122" r="150" fill="url(#sunGlow)"/>
<circle cx="1046" cy="122" r="42"  fill="#fff6cf" opacity=".95"/>
<circle cx="1046" cy="122" r="42"  fill="none" stroke="#ffeaa0" stroke-width="3" opacity=".6"/>

<!-- 远景山影 -->
<path d="M0,700 L0,640 C90,600 170,648 250,622 C330,596 400,646 470,634 C560,620 640,660 720,646 C820,628 900,664 980,650 C1070,634 1140,668 1200,652 L1200,700 Z"
      fill="#4e86b4" opacity=".38"/>
<path d="M0,700 L0,672 C120,650 200,682 300,668 C420,650 520,688 640,674 C760,660 860,692 980,678 C1090,666 1150,690 1200,682 L1200,700 Z"
      fill="#3d6f9c" opacity=".5"/>

<!-- ================= 云层（向后飘） ================= -->
<g class="cloud c1"><use href="#cloudShape" transform="translate(1420,150) scale(1.25)"/></g>
<g class="cloud c2"><use href="#cloudShape" transform="translate(1380,330) scale(.85)"/></g>
<g class="cloud c3"><use href="#cloudShape" transform="translate(1520,90)  scale(1.5)"/></g>
<g class="cloud c4"><use href="#cloudShape" transform="translate(1330,560) scale(1.1)"/></g>
<g class="cloud c2"><use href="#cloudShape" transform="translate(1600,600) scale(1.35)"/></g>
<g class="cloud c1"><use href="#cloudShape" transform="translate(1500,430) scale(.7)"/></g>

<!-- ================= 气流风线 ================= -->
<g stroke="#ffffff" stroke-linecap="round" fill="none">
  <path class="w1" d="M1180,330 h150" stroke-width="5" stroke-opacity=".55"/>
  <path class="w2" d="M1200,452 h120" stroke-width="4" stroke-opacity=".45"/>
  <path class="w3" d="M1160,258 h180" stroke-width="3" stroke-opacity=".4"/>
  <path class="w4" d="M1200,586 h140" stroke-width="4" stroke-opacity=".35"/>
</g>

<!-- ================= 飞机整体（含机翼上的一切） ================= -->
<g class="bob" filter="url(#soft)">

  <!-- 尾翼 -->
  <g>
    <path d="M212,338 L158,206 C152,196 162,186 174,190 L268,232 L276,336 Z" fill="url(#metalDark)" stroke="#5e7387" stroke-width="2"/>
    <path d="M212,338 L158,206 C152,196 162,186 174,190 L196,199 L228,330 Z" fill="#e8f0f8" opacity=".55"/>
    <!-- 尾翼标志：猴脸 -->
    <circle cx="212" cy="272" r="26" fill="url(#gold)"/>
    <path d="M200,266 c-6,-10 16,-16 22,-4 4,8 -4,14 -11,14 -6,0 -9,-4 -11,-10 z" fill="#e0563f"/>
    <circle cx="205" cy="266" r="2.6" fill="#20140c"/><circle cx="220" cy="266" r="2.6" fill="#20140c"/>
    <path d="M204,276 q9,7 18,0" stroke="#20140c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 水平尾翼 -->
    <path d="M214,394 L112,432 C104,436 108,446 118,447 L246,432 Z" fill="url(#metalDark)" stroke="#5e7387" stroke-width="2"/>
    <path d="M214,398 L130,432 L240,428 Z" fill="#eef4fa" opacity=".5"/>
  </g>

  <!-- 机身 -->
  <g>
    <path d="M204,338 C258,304 520,296 664,316 C736,326 780,350 786,384 C742,436 560,454 300,446 C218,442 184,398 204,338 Z"
          fill="url(#metal)" stroke="#6a8095" stroke-width="2.5"/>
    <!-- 机腹阴影 -->
    <path d="M232,424 C400,444 620,444 768,404 C712,442 520,456 300,448 C258,446 240,438 232,424 Z" fill="#59708a" opacity=".55"/>
    <!-- 金色腰线 -->
    <path d="M212,398 C400,424 620,420 776,394" stroke="url(#gold)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M212,398 C400,424 620,420 776,394" stroke="#fff3c4" stroke-width="2.5" fill="none" opacity=".7"/>
    <!-- 上部高光 -->
    <path d="M240,342 C330,326 520,320 660,332" stroke="#ffffff" stroke-width="8" fill="none" opacity=".65" stroke-linecap="round"/>
    <!-- 舷窗 -->
    <g>
      <rect x="300" y="382" width="20" height="26" rx="9" fill="#20415e"/><rect x="303" y="385" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="340" y="385" width="20" height="26" rx="9" fill="#20415e"/><rect x="343" y="388" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="380" y="387" width="20" height="26" rx="9" fill="#20415e"/><rect x="383" y="390" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="420" y="388" width="20" height="26" rx="9" fill="#20415e"/><rect x="423" y="391" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="460" y="388" width="20" height="26" rx="9" fill="#20415e"/><rect x="463" y="391" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="500" y="387" width="20" height="26" rx="9" fill="#20415e"/><rect x="503" y="390" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="540" y="385" width="20" height="26" rx="9" fill="#20415e"/><rect x="543" y="388" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
      <rect x="580" y="382" width="20" height="26" rx="9" fill="#20415e"/><rect x="583" y="385" width="8" height="10" rx="4" fill="#bfe6ff" opacity=".8"/>
    </g>
    <!-- 机身上文字 -->
    <text x="238" y="352" font-size="26" font-weight="700" fill="#2a3c52" opacity=".75" letter-spacing="3">齐天号</text>
    <!-- 铆钉 -->
    <g fill="#8fa3b7" opacity=".8">
      <circle cx="270" cy="409" r="2.4"/><circle cx="330" cy="415" r="2.4"/><circle cx="390" cy="419" r="2.4"/>
      <circle cx="450" cy="421" r="2.4"/><circle cx="510" cy="420" r="2.4"/><circle cx="570" cy="417" r="2.4"/>
      <circle cx="630" cy="412" r="2.4"/><circle cx="690" cy="405" r="2.4"/>
    </g>
  </g>

  <!-- 驾驶舱 + 孙悟空 -->
  <g>
    <!-- 舱体 -->
    <path d="M636,320 C684,296 748,304 772,340 L756,382 C700,392 652,380 638,362 Z" fill="url(#metal)" stroke="#6a8095" stroke-width="2"/>
    <!-- 孙悟空 -->
    <g>
      <!-- 尾巴 -->
      <g>
        <path d="M664,362 C640,368 628,346 646,332 C660,320 646,306 632,312" stroke="#b8792c" stroke-width="9" fill="none" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 664 362; 10 664 362; -8 664 362; 0 664 362" dur="2.6s" repeatCount="indefinite"/>
      </g>
      <!-- 身体（红金战袍） -->
      <path d="M672,356 C662,340 668,326 682,322 C698,318 706,330 704,344 L700,360 C692,366 678,364 672,356 Z" fill="url(#red)"/>
      <path d="M676,352 L702,344 L700,356 L678,360 Z" fill="url(#gold)" opacity=".9"/>
      <!-- 手臂 → 操纵杆 -->
      <path d="M700,340 C716,344 730,352 736,362" stroke="#e8b878" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M690,346 C706,352 720,360 726,368" stroke="#e8b878" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="692" cy="316" r="24" fill="url(#monkeyFur)"/>
      <path d="M672,314 C676,300 708,300 712,314 C716,330 700,340 692,338 C682,336 668,328 672,314 Z" fill="url(#skin)"/>
      <!-- 面部红桃纹 -->
      <path d="M680,310 C684,304 700,304 704,310 C708,318 700,326 692,326 C684,326 677,318 680,310 Z" fill="#f2a08c" opacity=".55"/>
      <circle cx="684" cy="314" r="3.4" fill="#1a1008"/><circle cx="700" cy="314" r="3.4" fill="#1a1008"/>
      <circle cx="685.4" cy="312.6" r="1.2" fill="#fff"/><circle cx="701.4" cy="312.6" r="1.2" fill="#fff"/>
      <path d="M688,322 q5,5 9,0" stroke="#5a2a18" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="692" cy="319" rx="2.6" ry="2" fill="#c07a48"/>
      <!-- 金箍 -->
      <path d="M670,306 C680,296 706,296 714,306" stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 凤翅紫金冠翎羽 -->
      <g>
        <path d="M690,298 C688,278 676,266 660,262" stroke="#f2c14a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M694,298 C700,278 714,266 730,264" stroke="#f2c14a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 692 298; 5 692 298; -5 692 298; 0 692 298" dur="1.8s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- 玻璃罩 -->
    <path d="M640,318 C688,292 752,300 776,338 L760,380 C702,390 654,378 640,360 Z" fill="url(#glass)" stroke="#9fd8f5" stroke-width="2.5"/>
    <path d="M652,322 C688,304 736,308 758,336" stroke="#ffffff" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    <!-- 操纵杆 -->
    <path d="M736,364 L744,346" stroke="#3f4a58" stroke-width="5" stroke-linecap="round"/>
    <circle cx="745" cy="344" r="5" fill="#c0392b"/>
  </g>

  <!-- 机头 + 螺旋桨 -->
  <g>
    <path d="M760,348 C794,356 800,370 796,386 C792,404 770,414 754,410 Z" fill="url(#metalDark)" stroke="#5e7387" stroke-width="2"/>
    <ellipse cx="800" cy="384" rx="10" ry="14" fill="url(#steel)" stroke="#6d7a86" stroke-width="2"/>
    <!-- 旋转桨叶 -->
    <g>
      <g fill="url(#steel)" stroke="#5d6a76" stroke-width="1.5">
        <path d="M800,384 C806,352 802,322 796,296 C790,320 788,356 792,384 Z"/>
        <path d="M800,384 C806,352 802,322 796,296 C790,320 788,356 792,384 Z" transform="rotate(120 800 384)"/>
        <path d="M800,384 C806,352 802,322 796,296 C790,320 788,356 792,384 Z" transform="rotate(240 800 384)"/>
      </g>
      <circle cx="800" cy="384" r="9" fill="url(#gold)" stroke="#8a5c10" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0 800 384" to="360 800 384" dur="0.22s" repeatCount="indefinite"/>
    </g>
    <!-- 运动模糊 -->
    <circle cx="800" cy="384" r="96" fill="none" stroke="#ffffff" stroke-width="3" opacity=".14"/>
    <circle cx="800" cy="384" r="70" fill="none" stroke="#ffffff" stroke-width="2" opacity=".1"/>
  </g>

  <!-- 主翼 -->
  <g>
    <path d="M318,470 C520,452 800,450 958,462 C1032,468 1066,492 1042,514 C900,540 560,540 332,496 Z"
          fill="url(#wing)" stroke="#6d8399" stroke-width="2.5"/>
    <!-- 上表面高光 -->
    <path d="M330,472 C520,456 800,454 954,466" stroke="#ffffff" stroke-width="7" fill="none" opacity=".7" stroke-linecap="round"/>
    <!-- 翼肋 -->
    <g stroke="#8fa5ba" stroke-width="2" opacity=".55">
      <path d="M430,462 L432,510"/><path d="M540,458 L544,518"/><path d="M650,456 L656,524"/>
      <path d="M760,456 L768,528"/><path d="M870,458 L880,530"/>
    </g>
    <!-- 襟翼分割线 -->
    <path d="M352,486 C520,524 800,528 1000,498" stroke="#7890a6" stroke-width="3" fill="none" opacity=".7"/>
    <!-- 翼上跑道虚线 -->
